<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaFix Admin · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;min-height:100vh;
    background:#1B2A4A;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;
    position:relative;overflow:hidden;
  }
  body::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(249,115,22,.16);top:-160px;right:-120px;filter:blur(20px)}
  body::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(35,51,87,.6);bottom:-160px;left:-120px}
  .login{position:relative;z-index:1;width:100%;max-width:404px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;font-weight:800;font-size:21px;margin-bottom:8px}
  .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(150deg,#F97316,#fb8a3c);display:grid;place-items:center;box-shadow:0 8px 18px rgba(249,115,22,.4)}
  .mark svg{width:24px;height:24px}
  .sub{text-align:center;color:#9aa6c2;font-size:14px;margin-bottom:30px}
  .card{background:#fff;border-radius:20px;padding:34px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
  .card h1{color:#1B2A4A;font-size:22px;margin-bottom:5px;letter-spacing:-.01em}
  .card .lead{color:#5A6478;font-size:14px;margin-bottom:24px}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
  .field label{font-size:12.5px;font-weight:700;color:#1B2A4A}
  .field input{border:1.5px solid #E6EAF1;border-radius:10px;padding:13px 14px;font-size:15px;color:#1B2A4A;font-family:inherit;transition:border-color .15s,box-shadow .15s}
  .field input:focus{outline:none;border-color:#F97316;box-shadow:0 0 0 4px rgba(249,115,22,.12)}
  .rowx{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:13.5px}
  .rowx label{display:flex;align-items:center;gap:8px;color:#5A6478;font-weight:600;cursor:pointer}
  .rowx a{color:#F97316;font-weight:700;text-decoration:none}
  .btn{width:100%;background:#F97316;color:#fff;font-weight:800;font-size:15.5px;border:none;border-radius:11px;padding:15px;cursor:pointer;font-family:inherit;box-shadow:0 10px 22px rgba(249,115,22,.32);transition:background .15s,transform .12s;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn:hover:not(:disabled){background:#EA6A0C;transform:translateY(-1px)}
  .btn:disabled{opacity:.7;cursor:not-allowed;transform:none}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err-msg{margin-top:14px;padding:12px 14px;background:#fbeaea;border:1px solid #f5c6c6;border-radius:10px;color:#c0392b;font-size:13.5px;font-weight:600;display:none}
  .err-msg.show{display:block}
  .foot{text-align:center;margin-top:24px;color:#7e8aa6;font-size:12.5px}
</style>
</head>
<body>
  <div class="login">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5c2.2 3 6 7 6 10.8a6 6 0 0 1-12 0C6 9.5 9.8 5.5 12 2.5z"/></svg></span>
      AquaFix
    </div>
    <p class="sub">Admin Panel</p>
    <div class="card">
      <h1>Sign in</h1>
      <p class="lead">Welcome back. Please enter your details.</p>
      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@aquafixplumbing.com.au" required autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password"></div>
        <div class="rowx">
          <label><input type="checkbox" checked> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="btn" type="submit" id="loginBtn">Sign in to Dashboard</button>
        <p class="err-msg" id="loginErr">Invalid email or password. Please try again.</p>
      </form>
    </div>
    <p class="foot">© 2026 AquaFix Plumbing · Secure admin access</p>
  </div>
<script>
  var SUPABASE_URL  = 'https://zrkawewphxvskwkpsywi.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpya2F3ZXdwaHh2c2t3a3BzeXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTA5NDUsImV4cCI6MjA5NjQ4Njk0NX0.720XSZ7kEIVm0o0_RC6N18MwL_1YrQ-8nZ7dt6b9wLs';

  /* redirect immediately if already logged in */
  if(sessionStorage.getItem('adminToken')){ location.href = 'index.html'; }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();

    var email    = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var btn      = document.getElementById('loginBtn');
    var errEl    = document.getElementById('loginErr');

    errEl.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in…';

    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(res){
      return res.json().then(function(data){
        if(!res.ok) throw new Error(data.error_description || data.msg || 'Auth failed');
        return data;
      });
    })
    .then(function(data){
      sessionStorage.setItem('adminToken', data.access_token);
      sessionStorage.setItem('adminRefreshToken', data.refresh_token || '');
      sessionStorage.setItem('adminUser', JSON.stringify(data.user || {}));
      btn.innerHTML = '<span class="spinner"></span>Redirecting…';
      location.href = 'index.html';
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = 'Sign in to Dashboard';
      errEl.classList.add('show');
    });
  });
</script>
</body>
</html>
